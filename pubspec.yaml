name: home_fit_daily
description: "HomeFit – Home Workout Fitness. Premium offline home workout app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  fl_chart: ^0.70.2
  lottie: ^3.3.1
  flutter_animate: ^4.5.2
  flutter_local_notifications: ^18.0.1
  shared_preferences: ^2.5.3
  google_fonts: ^6.2.1
  animations: ^2.0.11
  intl: ^0.20.2
  uuid: ^4.5.1
  timezone: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/animations/
    - assets/images/
