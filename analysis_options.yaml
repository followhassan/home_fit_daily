# Static analysis configuration. See https://dart.dev/tools/analysis.
include: package:flutter_lints/flutter.yaml

formatter:
  page_width: 100

analyzer:
  exclude:
    # Superseded prototype code kept only for reference; not compiled.
    - legacy_prototype/**

linter:
  rules:
    - prefer_single_quotes
    - avoid_print
    - prefer_final_locals
    - unawaited_futures
    - always_declare_return_types
    - cancel_subscriptions
    - close_sinks
